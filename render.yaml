services:
  - type: web
    name: bora-api
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bora-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
      - key: BORA_BASE_FARE
        value: "1.90"
      - key: BORA_PRICE_PER_KM
        value: "1.35"
      - key: BORA_PRICE_PER_MINUTE
        value: "0.27"
      - key: BORA_AVG_SPEED_KMH
        value: "30"
databases:
  - name: bora-db
    plan: free
