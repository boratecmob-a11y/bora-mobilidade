services:
  - type: web
    name: bora-api
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bora-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        sync: false
      - key: BORA_COMMISSION_PERCENT
        value: "20"
      - key: BORA_BASE_FARE
        value: "5"
      - key: BORA_PRICE_PER_KM
        value: "2"
      - key: BORA_PRICE_PER_MINUTE
        value: "0.35"
      - key: BORA_AVG_SPEED_KMH
        value: "30"
      - key: MP_APP_ID
        sync: false
      - key: MP_CLIENT_SECRET
        sync: false
      - key: MP_REDIRECT_URI
        sync: false
      - key: MP_NOTIFICATION_URL
        sync: false
      - key: MP_MARKETPLACE_FEE_PERCENT
        value: "20"
databases:
  - name: bora-db
    plan: free
